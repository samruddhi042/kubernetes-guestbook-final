<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        h1 { color: #333; }
        input[type=text] { width: 70%; padding: 8px; font-size: 16px; }
        button { padding: 8px 16px; font-size: 16px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        #output { margin-top: 20px; }
        .entry { padding: 8px; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Guestbook</h1>
    </div>
    <div id="guestbook-ui">
        <form onsubmit="addEntry(event)">
            <input id="entry" type="text" placeholder="Sign the guestbook!" />
            <button type="submit">Submit</button>
        </form>
        <div id="output"></div>
    </div>
    <script>
        function addEntry(e) {
            e.preventDefault();
            const val = document.getElementById('entry').value;
            if (!val) return;
            const div = document.createElement('div');
            div.className = 'entry';
            div.textContent = val;
            document.getElementById('output').prepend(div);
            document.getElementById('entry').value = '';
        }
    </script>
</body>
</html>
